name: E-Commerce Test Automation CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run nightly at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_tags:
        description: 'Cucumber tags to run (e.g., @smoke, @regression)'
        required: false
        default: '@smoke'
      environment:
        description: 'Target environment'
        required: false
        default: 'config'
        type: choice
        options:
          - config
          - staging
          - production
      browser:
        description: 'Browser to run tests on'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx1024m'

jobs:
  # ========================================
  # JOB 1: Smoke Tests
  # ========================================
  smoke-tests:
    name: 🔥 Smoke Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: 📦 Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 🎭 Install Playwright Browsers
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium"

      - name: 🧪 Run Smoke Tests
        run: |
          mvn clean test \
            -Denv=${{ github.event.inputs.environment || 'config' }} \
            -Dbrowser=${{ github.event.inputs.browser || 'chromium' }} \
            -Dheadless=true \
            -Dcucumber.filter.tags="${{ github.event.inputs.test_tags || '@SmokeTest' }}"
        continue-on-error: true

      - name: 📊 Generate Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke
          path: target/allure-results
          retention-days: 30

      - name: 📋 Upload Cucumber Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports-smoke
          path: target/cucumber-reports
          retention-days: 30

      - name: 📸 Upload Screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-smoke
          path: target/traces/
          retention-days: 10

